name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoFood-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar Release com numero de versao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk "AutoFood-v$N.apk"
          if [ "${{ github.ref_name }}" = "main" ]; then FLAG="--latest"; else FLAG="--prerelease"; fi
          gh release create "v$N" "AutoFood-v$N.apk" \
            --target "${{ github.sha }}" \
            --title "AutoFood BRP v$N" \
            --notes "Build $N da branch ${{ github.ref_name }}. Baixe o arquivo AutoFood-v$N.apk e instale." \
            $FLAG
